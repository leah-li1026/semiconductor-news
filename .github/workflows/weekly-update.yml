name: 每周一自动更新价格数据

on:
  schedule:
    # 每周一 09:00 UTC+8 (01:00 UTC) — 主调度
    - cron: '0 1 * * 1'
    # 每周一 12:00 UTC+8 (04:00 UTC) — 备用调度（主调度失败时兜底）
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: '强制更新（忽略抓取失败）'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

# 防止同一时间多个workflow并行运行
concurrency:
  group: weekly-update
  cancel-in-progress: true

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Chrome（Selenium 需要）
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4 selenium

      - name: 更新存储芯片价格
        id: storage
        run: |
          python update_prices.py
          echo "storage_ok=true" >> $GITHUB_OUTPUT

      - name: 更新阻容感/PCB 价格
        id: passive
        continue-on-error: true
        run: |
          python update_passive.py
          echo "passive_ok=true" >> $GITHUB_OUTPUT

      - name: LLM 智能分析生成
        id: analysis
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          python update_analysis.py
          echo "analysis_ok=true" >> $GITHUB_OUTPUT

      - name: 输出更新摘要
        if: always()
        run: |
          echo "## 📊 更新摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 步骤 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.storage.outputs.storage_ok }}" = "true" ]; then
            echo "| 存储芯片价格 | ✅ 成功 |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 存储芯片价格 | ❌ 失败 |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.passive.outputs.passive_ok }}" = "true" ]; then
            echo "| 阻容感/PCB 价格 | ✅ 成功 |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 阻容感/PCB 价格 | ⚠️ 失败（不阻断） |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.analysis.outputs.analysis_ok }}" = "true" ]; then
            echo "| LLM 智能分析 | ✅ 成功 |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| LLM 智能分析 | ⚠️ 失败（不阻断） |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📅 执行时间: $(date '+%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_STEP_SUMMARY

      - name: 飞书通知
        if: always() && secrets.FEISHU_WEBHOOK_URL != ''
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK_URL }}
          STORAGE_OK: ${{ steps.storage.outputs.storage_ok }}
          PASSIVE_OK: ${{ steps.passive.outputs.passive_ok }}
          ANALYSIS_OK: ${{ steps.analysis.outputs.analysis_ok }}
          HAS_CHANGES: ${{ steps.changes.outputs.changed }}
        run: |
          # 构建状态文本
          STATUS_LIST=""
          FAIL_COUNT=0

          if [ "$STORAGE_OK" = "true" ]; then
            STATUS_LIST="${STATUS_LIST}✅ 存储芯片价格：成功\\n"
          else
            STATUS_LIST="${STATUS_LIST}❌ 存储芯片价格：失败\\n"
            FAIL_COUNT=$((FAIL_COUNT+1))
          fi

          if [ "$PASSIVE_OK" = "true" ]; then
            STATUS_LIST="${STATUS_LIST}✅ 阻容感/PCB 价格：成功\\n"
          else
            STATUS_LIST="${STATUS_LIST}⚠️ 阻容感/PCB 价格：失败（抓取被拦截）\\n"
            FAIL_COUNT=$((FAIL_COUNT+1))
          fi

          if [ "$ANALYSIS_OK" = "true" ]; then
            STATUS_LIST="${STATUS_LIST}✅ LLM 智能分析：成功\\n"
          else
            STATUS_LIST="${STATUS_LIST}⚠️ LLM 智能分析：失败\\n"
          fi

          if [ "$HAS_CHANGES" = "true" ]; then
            STATUS_LIST="${STATUS_LIST}\\n📦 数据已提交推送"
          else
            STATUS_LIST="${STATUS_LIST}\\n📦 无变更（数据未更新）"
          fi

          # 确定标题颜色
          if [ $FAIL_COUNT -gt 0 ]; then
            TITLE="⚠️ 半导体情报站更新异常"
            COLOR="orange"
          else
            TITLE="✅ 半导体情报站更新成功"
            COLOR="green"
          fi

          # 发送飞书消息
          curl -s -X POST "$FEISHU_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{
              \"msg_type\": \"interactive\",
              \"card\": {
                \"header\": {
                  \"title\": {\"tag\": \"plain_text\", \"content\": \"$TITLE\"},
                  \"template\": \"$COLOR\"
                },
                \"elements\": [
                  {
                    \"tag\": \"div\",
                    \"text\": {
                      \"tag\": \"lark_md\",
                      \"content\": \"📅 $(date '+%Y-%m-%d %H:%M')\\n\\n${STATUS_LIST}\"
                    }
                  },
                  {
                    \"tag\": \"action\",
                    \"actions\": [
                      {
                        \"tag\": \"button\",
                        \"text\": {\"tag\": \"plain_text\", \"content\": \"查看情报站\"},
                        \"url\": \"https://leah-li1026.github.io/semiconductor-news/index.html\",
                        \"type\": \"primary\"
                      },
                      {
                        \"tag\": \"button\",
                        \"text\": {\"tag\": \"plain_text\", \"content\": \"查看日志\"},
                        \"url\": \"https://github.com/leah-li1026/semiconductor-news/actions\",
                        \"type\": \"default\"
                      }
                    ]
                  }
                ]
              }
            }"

      - name: 检查是否有变更
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No price changes this week"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Prices updated"
            git diff --stat
          fi

      - name: 提交并推送
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html _storage_history.json passive_history.json _analysis_data.json
          git commit -m "chore: 每周自动更新价格数据 $(date +%Y-%m-%d)"
          git push